<title>合租生活管家</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap');

:root{
  --page-bg:#ECE7DF;
  --bg:#F7F4EF;
  --surface:#FFFFFF;
  --surface-2:#EFEBE4;
  --ink:#2A2620;
  --ink-2:#6E675D;
  --ink-3:#9C9489;
  --line:#E7E1D8;
  --accent:#1F6B57;
  --accent-2:#164D3E;
  --accent-soft:#DFEBE6;
  --amber:#B8781F;
  --amber-soft:#F4E8D2;
  --danger:#C14E44;
  --danger-soft:#F4DFDC;
  --shadow:0 24px 60px rgba(42,38,32,.22), 0 2px 8px rgba(42,38,32,.08);
  --font-serif:"Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-sans:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#100E0B;
    --bg:#1B1814;
    --surface:#242019;
    --surface-2:#2E2921;
    --ink:#F0EBE2;
    --ink-2:#A79F94;
    --ink-3:#7E776C;
    --line:#383229;
    --accent:#57A98C;
    --accent-2:#74C2A6;
    --accent-soft:#1E352D;
    --amber:#D89A4A;
    --amber-soft:#3A2E1C;
    --danger:#DE7A70;
    --danger-soft:#3D2623;
    --shadow:0 24px 60px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page-bg:#100E0B;
  --bg:#1B1814;
  --surface:#242019;
  --surface-2:#2E2921;
  --ink:#F0EBE2;
  --ink-2:#A79F94;
  --ink-3:#7E776C;
  --line:#383229;
  --accent:#57A98C;
  --accent-2:#74C2A6;
  --accent-soft:#1E352D;
  --amber:#D89A4A;
  --amber-soft:#3A2E1C;
  --danger:#DE7A70;
  --danger-soft:#3D2623;
  --shadow:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--page-bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--ink)}
::-webkit-scrollbar{width:0;height:0}

.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:32px 16px;background:radial-gradient(1200px 700px at 50% -10%, rgba(31,107,87,.10), transparent 60%), var(--page-bg)}
.stage-caption{font-size:12.5px;color:var(--ink-2);letter-spacing:.04em;display:flex;align-items:center;gap:8px;opacity:.85}
.stage-caption::before,.stage-caption::after{content:"";height:1px;width:22px;background:var(--ink-3);opacity:.5}

.phone{width:390px;height:min(844px, 92vh);background:var(--bg);border-radius:34px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:440px){.stage{padding:0;gap:0}.stage-caption{display:none}.phone{width:100%;height:100vh;border-radius:0;border:none;box-shadow:none}}

.statusbar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;color:var(--ink);flex:0 0 auto}
.statusbar .sb-right{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}

.app-header{padding:4px 20px 14px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .wordmark{font-family:var(--font-serif);font-weight:700;font-size:19px;letter-spacing:.01em;line-height:1.2}
.brand .house{font-size:11.5px;color:var(--ink-2);letter-spacing:.02em}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:transform .12s ease}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--bg)}

.content{flex:1 1 auto;overflow-y:auto;padding:2px 20px 96px}
.screen{display:none;animation:fade .22s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.sec-title{font-family:var(--font-serif);font-weight:700;font-size:22px;line-height:1.25;margin-bottom:2px}
.sec-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:16px}

.hello{margin:6px 0 14px}
.hello .h1{font-family:var(--font-serif);font-weight:700;font-size:24px;line-height:1.25}
.hello .h2{font-size:13px;color:var(--ink-2);margin-top:3px}
.hero{background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden;margin-bottom:14px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .k{font-size:11.5px;opacity:.82;letter-spacing:.05em}
.hero .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:5px}
.hero .v small{font-size:15px;font-weight:500;opacity:.85}
.hero .row{display:flex;gap:18px;margin-top:12px;font-size:12px;opacity:.9}
.hero .row span b{font-weight:700;font-variant-numeric:tabular-nums}

.block{margin-bottom:18px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.block-head h3{font-size:15px;font-weight:700}
.block-head .more{font-size:12px;color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}

.todo{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.todo .dot{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.todo .dot svg{width:16px;height:16px}
.todo .t{flex:1;min-width:0}
.todo .t .l{font-size:13.5px;font-weight:600;line-height:1.35}
.todo .t .s{font-size:12px;color:var(--ink-2);margin-top:2px}
.todo .go{font-size:12px;color:var(--accent);font-weight:600;flex:0 0 auto;padding:4px 0;white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.green{background:var(--accent-soft);color:var(--accent)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--danger-soft);color:var(--danger)}
.pill.grey{background:var(--surface-2);color:var(--ink-2)}

.chip{font-size:13px;font-weight:500;padding:7px 13px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent;transition:all .12s ease}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip:active{transform:scale(.95)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}

.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex:0 0 auto}
.av.sm{width:26px;height:26px;font-size:11px}
.av.me{box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent)}

.bill{display:flex;align-items:center;gap:12px}
.bill .ic,.item .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto}
.item .ic{color:var(--ink-2)}
.bill .ic svg,.item .ic svg{width:20px;height:20px}
.bill .b,.item .b{flex:1;min-width:0}
.bill .b .n,.item .b .n{font-size:14px;font-weight:600}
.bill .b .m,.item .b .m{font-size:11.5px;color:var(--ink-2);margin-top:2px;display:flex;align-items:center;gap:6px}
.bill .amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.card .bill + .bill{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.card .item + .item{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.card .rule + .rule{margin-top:10px}

.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{font-size:11px;color:var(--ink-2)}
.stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
.stat .v small{font-size:11px;font-weight:500;color:var(--ink-3)}

.settle .line{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px}
.settle .line + .line{border-top:1px solid var(--line)}
.settle .who{display:flex;align-items:center;gap:7px;flex:1;font-weight:600}
.settle .arrow{color:var(--ink-3)}
.settle .amt{font-weight:700;font-variant-numeric:tabular-nums}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;position:relative}
.day.today{border-color:var(--accent);background:var(--accent-soft)}
.day .d{font-size:11px;color:var(--ink-3);font-weight:600}
.day .p{font-size:12px;font-weight:700;margin-top:7px}
.day .a{font-size:10px;color:var(--ink-2);margin-top:1px}
.day .ck{position:absolute;top:4px;right:5px;width:13px;height:13px;border-radius:50%;background:var(--accent);display:none;align-items:center;justify-content:center}
.day.done .ck{display:flex}
.day .ck svg{width:8px;height:8px;color:#fff;stroke-width:3.5}
.day.today .d{color:var(--accent)}

.rule{cursor:pointer}
.rule .top{display:flex;align-items:flex-start;gap:12px}
.rule .top .r{flex:1;min-width:0}
.rule .top .r .n{font-size:14px;font-weight:600;line-height:1.35}
.rule .top .r .m{font-size:11.5px;color:var(--ink-2);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rule .detail{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.rule.open .detail{display:block}
.rule .detail p{font-size:13px;color:var(--ink-2);line-height:1.6}
.rule .detail .act{margin-top:11px;display:flex;gap:8px}
.sign-line{display:flex;align-items:center;gap:6px;margin-top:10px}
.sign-line .sig{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:10px}
.sign-line .sig.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sign-line .sig svg{width:11px;height:11px;stroke-width:3}
.sign-line .lbl{font-size:11.5px;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;padding:11px 16px;border-radius:13px;transition:transform .12s ease, opacity .12s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.block{width:100%}
.btn.sm{font-size:13px;padding:8px 12px;border-radius:10px}
.btn svg{width:16px;height:16px}

.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--ink-3);border-radius:12px;transition:color .15s ease}
.tab svg{width:22px;height:22px}
.tab span{font-size:10.5px;font-weight:600}
.tab.active{color:var(--accent)}
.tab:active{opacity:.7}

.fab{position:absolute;right:16px;bottom:76px;z-index:30;display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;padding:13px 20px;border-radius:999px;box-shadow:0 8px 22px rgba(22,77,62,.35);transition:transform .12s ease}
.fab:hover{background:var(--accent-2)}
.fab:active{transform:scale(.96)}
.fab svg{width:17px;height:17px}

.modal-mask{position:fixed;inset:0;background:rgba(20,16,12,.46);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-mask.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:390px;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 20px 24px;transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
.modal-mask.show .sheet{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--font-serif);font-weight:700;font-size:19px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;outline:none;transition:border-color .15s ease}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:none;min-height:72px;line-height:1.5}
.amount-input{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sheet .btn{margin-top:4px}
.hint{font-size:12px;color:var(--ink-2);line-height:1.6}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;z-index:60;transition:opacity .2s ease, transform .2s ease;white-space:nowrap;max-width:86vw;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage">
  <div class="stage-caption">交互原型 · 点击底部标签切换模块</div>
  <div class="phone">
    <div class="statusbar">
      <span>21:47</span>
      <span class="sb-right">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4.5" y="4.5" width="3" height="6.5" rx="0.6"/><rect x="9" y="2" width="3" height="9" rx="0.6"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.6" opacity=".35"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 3.5a9 9 0 0 1 13 0M3.5 6a5.5 5.5 0 0 1 8 0"/><circle cx="7.5" cy="8.8" r="1.2" fill="currentColor" stroke="none"/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="0.5" y="0.5" width="17" height="10" rx="2.5"/><rect x="2" y="2" width="12" height="7" rx="1" fill="currentColor" stroke="none"/><path d="M19.5 4v3" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
    </div>

    <header class="app-header">
      <div class="brand">
        <span class="wordmark">合租生活管家</span>
        <span class="house">梧桐里 3 栋 602 · 3 位室友</span>
      </div>
      <button class="icon-btn" onclick="toast('暂无新通知')" aria-label="通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 0 0-12 0c0 6.5-1.8 7.5-1.8 7.5h15.6S18 15.5 18 9z"/><path d="M10.2 20a1.9 1.9 0 0 0 3.6 0"/></svg>
        <span class="badge">3</span>
      </button>
    </header>

    <main class="content">
      <section class="screen" id="screen-home"></section>
      <section class="screen" id="screen-bills"></section>
      <section class="screen" id="screen-duty"></section>
      <section class="screen" id="screen-items"></section>
      <section class="screen" id="screen-rules"></section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="home" onclick="switchTab('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-4.5h4V20"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-tab="bills" onclick="switchTab('bills')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.4L14 21l-2-1.4L10 21l-2-1.4L6 21z"/><path d="M9.5 8h5M9.5 12h5"/></svg>
        <span>账单</span>
      </button>
      <button class="tab" data-tab="duty" onclick="switchTab('duty')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3.5V6M16 3.5V6M4 10h16"/><path d="m9.2 15 1.8 1.8 3.8-3.8"/></svg>
        <span>值日</span>
      </button>
      <button class="tab" data-tab="items" onclick="switchTab('items')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 7v10l-7 3.5L5 17V7z"/><path d="M5 7l7 3.5L19 7M12 10.5V20.5"/></svg>
        <span>物品</span>
      </button>
      <button class="tab" data-tab="rules" onclick="switchTab('rules')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4.5H18"/><path d="M9 12h6M9 15.5h6"/></svg>
        <span>公约</span>
      </button>
    </nav>
    <button class="fab" onclick="openBill()" aria-label="记一笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>记一笔</span>
    </button>
  </div>
</div>

<div class="modal-mask" id="modal-bill">
  <div class="sheet">
    <div class="grab"></div>
    <h3>记一笔开销</h3>
    <div class="field"><label>金额（¥）</label><input class="amount-input" id="bill-amt" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
    <div class="field"><label>类别</label><div class="chip-row" id="bill-cat"></div></div>
    <div class="field"><label>谁垫付的</label><div class="chip-row" id="bill-payer"></div></div>
    <div class="field"><label>分摊方式</label><div class="chip-row" id="bill-split"></div></div>
    <div class="field"><label>备注（选填）</label><input id="bill-note" type="text" placeholder="如：8 月电费"></div>
    <div class="hint">均摊按 3 人平均；按面积 / 自定义分摊在原型里按均摊演示。</div>
    <button class="btn primary block" onclick="submitBill()">提交并分摊</button>
  </div>
</div>

<div class="modal-mask" id="modal-item">
  <div class="sheet">
    <div class="grab"></div>
    <h3>登记公共物品</h3>
    <div class="field"><label>物品名称</label><input id="item-name" type="text" placeholder="如：抽纸"></div>
    <div class="field"><label>分类</label><div class="chip-row" id="item-cat"></div></div>
    <div class="field"><label>库存状态</label><div class="chip-row" id="item-stock"></div></div>
    <div class="field"><label>最近采购人</label><div class="chip-row" id="item-payer"></div></div>
    <button class="btn primary block" onclick="submitItem()">登记</button>
  </div>
</div>

<div class="modal-mask" id="modal-rule">
  <div class="sheet">
    <div class="grab"></div>
    <h3>起草一份公约</h3>
    <div class="field"><label>标题</label><input id="rule-title" type="text" placeholder="如：厨房卫生公约"></div>
    <div class="field"><label>类型</label><div class="chip-row" id="rule-type"></div></div>
    <div class="field"><label>具体条款</label><textarea id="rule-body" placeholder="写下希望室友共同遵守的约定…"></textarea></div>
    <button class="btn primary block" onclick="submitRule()">提交给室友签字</button>
  </div>
</div>

<div id="toast"></div>

<script>
var PEOPLE = ['小林','阿哲','小满'];
var PCOLOR = {'小林':'#1F6B57','阿哲':'#C8842B','小满':'#C0554B'};
var CATS = ['房租','水电','燃气','网费','日用','其他'];
var SPLITS = ['均摊','按面积','自定义'];
var ITEM_CATS = ['清洁','日用','厨房','其他'];
var STOCKS = ['充足','一般','低'];
var RULE_TYPES = ['卫生','费用','作息','访客','其他'];

var bills = [
  {title:'房租 · 9 月', amount:3600, payer:'小林', date:'9/01', status:'settled'},
  {title:'电费 · 8 月', amount:186.4, payer:'阿哲', date:'9/05', status:'pending'},
  {title:'网费 · 9 月', amount:120, payer:'小满', date:'9/02', status:'settled'},
  {title:'燃气费 · 8 月', amount:54.8, payer:'小林', date:'9/03', status:'settled'},
  {title:'日用品 · 抽纸垃圾袋', amount:36.2, payer:'小满', date:'9/06', status:'settled'}
];
var duties = [
  {day:'周一', area:'厨房', person:'小满', done:true},
  {day:'周二', area:'卫生间', person:'阿哲', done:true},
  {day:'周三', area:'客厅', person:'小林', done:true},
  {day:'周四', area:'倒垃圾', person:'小满', done:true},
  {day:'周五', area:'厨房', person:'小林', done:false, today:true},
  {day:'周六', area:'卫生间', person:'阿哲', done:false},
  {day:'周日', area:'客厅', person:'小满', done:false}
];
var items = [
  {name:'抽纸', cat:'日用', stock:'低', note:'仅剩 1 提', by:'小满'},
  {name:'洗衣液', cat:'清洁', stock:'一般', note:'剩半瓶', by:'小林'},
  {name:'垃圾袋', cat:'日用', stock:'一般', note:'剩 2 卷', by:'阿哲'},
  {name:'食用油', cat:'厨房', stock:'低', note:'已见底', by:'小林'},
  {name:'洗洁精', cat:'清洁', stock:'充足', note:'1 瓶', by:'小满'},
  {name:'大米', cat:'厨房', stock:'一般', note:'半袋', by:'阿哲'}
];
var rules = [
  {title:'水电费分摊规则', author:'小林', signedBy:['小林','阿哲','小满'], type:'费用', body:'房租、水电、网费、燃气均按人头 AA 均摊；空调旺季（7–9 月）电费由卧室多开空调的一方多承担 10%。'},
  {title:'客厅及公共区域卫生公约', author:'阿哲', signedBy:['阿哲','小满'], type:'卫生', body:'公共区域垃圾及时清理；厨房用完灶台当天擦拭；外卖盒不过夜；周末轮流大扫除。'},
  {title:'深夜安静时段约定', author:'小满', signedBy:['小林','阿哲','小满'], type:'作息', body:'23:00 后公共区域保持安静，不外放视频；洗澡尽量安排在 24:00 前。'},
  {title:'访客与留宿规则', author:'阿哲', signedBy:['阿哲'], type:'访客', body:'带朋友回来提前在群里说一声；留宿需征得所有人同意，原则上每月不超过 2 次。'}
];

var billForm = {cat:'水电', payer:'小林', split:'均摊'};
var itemForm = {cat:'日用', stock:'一般', payer:'小林'};
var ruleForm = {type:'卫生'};

function fmt(n){ return n.toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function av(name, cls){
  var c = PCOLOR[name] || '#888';
  var me = name === '小林' ? ' me' : '';
  return '<span class="av'+(cls?' '+cls:'')+me+'" style="background:'+c+'">'+name[0]+'</span>';
}
function computeSettle(){
  var total = bills.reduce(function(s,b){return s+b.amount;},0);
  var per = total/3;
  var paid = {}; PEOPLE.forEach(function(p){paid[p]=0;});
  bills.forEach(function(b){paid[b.payer]+=b.amount;});
  var balances = PEOPLE.map(function(p){return {name:p, bal: paid[p]-per};});
  var creditor = balances.filter(function(x){return x.bal>0.001;}).sort(function(a,b){return b.bal-a.bal;})[0];
  var debtors = balances.filter(function(x){return x.bal<-0.001;});
  var transfers = debtors.map(function(d){return {from:d.name, to:creditor.name, amt:-d.bal};});
  return {total:total, per:per, transfers:transfers};
}

function renderChips(id, opts, sel, fn){
  document.getElementById(id).innerHTML = opts.map(function(o){
    return '<button type="button" class="chip'+(o===sel?' on':'')+'" onclick="'+fn+'(\''+o+'\')">'+o+'</button>';
  }).join('');
}
function setBillCat(v){ billForm.cat=v; renderChips('bill-cat',CATS,v,'setBillCat'); }
function setBillPayer(v){ billForm.payer=v; renderChips('bill-payer',PEOPLE,v,'setBillPayer'); }
function setBillSplit(v){ billForm.split=v; renderChips('bill-split',SPLITS,v,'setBillSplit'); }
function setItemCat(v){ itemForm.cat=v; renderChips('item-cat',ITEM_CATS,v,'setItemCat'); }
function setItemStock(v){ itemForm.stock=v; renderChips('item-stock',STOCKS,v,'setItemStock'); }
function setItemPayer(v){ itemForm.payer=v; renderChips('item-payer',PEOPLE,v,'setItemPayer'); }
function setRuleType(v){ ruleForm.type=v; renderChips('rule-type',RULE_TYPES,v,'setRuleType'); }

function todo(color, icon, l, s, tab, go){
  var ic = {receipt:'<path d="M6 3h12v18l-2-1.4L14 21l-2-1.4L10 21l-2-1.4L6 21z"/><path d="M9.5 8h5"/>', check:'<path d="M5 12l4 4 10-10"/>', box:'<path d="M12 3.5 19 7v10l-7 3.5L5 17V7z"/><path d="M5 7l7 3.5L19 7"/>', doc:'<path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4.5H18"/>'}[icon];
  var bg = {amber:'var(--amber-soft)', green:'var(--accent-soft)', red:'var(--danger-soft)'}[color];
  var fg = {amber:'var(--amber)', green:'var(--accent)', red:'var(--danger)'}[color];
  return '<div class="todo"><div class="dot" style="background:'+bg+';color:'+fg+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ic+'</svg></div>'+
    '<div class="t"><div class="l">'+l+'</div><div class="s">'+s+'</div></div>'+
    '<span class="go" onclick="switchTab(\''+tab+'\')">'+go+' ›</span></div>';
}

function renderHome(){
  var s = computeSettle();
  var pending = bills.filter(function(b){return b.status==='pending';});
  var today = duties.filter(function(d){return d.today;})[0];
  var low = items.filter(function(i){return i.stock==='低';});
  var unsigned = rules.filter(function(r){return r.signedBy.indexOf('小林')<0;});

  var todos = '';
  if(pending.length){ todos += todo('amber','receipt', pending[0].title+' ¥'+fmt(pending[0].amount)+' 待确认', pending[0].payer+' 垫付，等你确认后 AA','bills','去确认'); }
  if(today && !today.done){ todos += todo('green','check','今天轮到你值日 · '+today.area, today.day+' · 记得完成打卡','duty','去打卡'); }
  if(low.length){ todos += todo('red','box', low.length+' 件物品库存偏低', low.map(function(i){return i.name;}).join('、')+' 建议尽快补货','items','去处理'); }
  if(unsigned.length){ todos += todo('amber','doc', '《'+unsigned[0].title+'》待你签字', unsigned[0].author+' 起草 · 已 '+unsigned[0].signedBy.length+'/3 人同意','rules','去查看'); }
  if(!todos){ todos = '<div style="text-align:center;padding:24px 0;color:var(--ink-3);font-size:13px">今天都处理完啦 🎉</div>'; }

  document.getElementById('screen-home').innerHTML =
    '<div class="hello"><div class="h1">晚上好，小林</div><div class="h2">9 月 12 日 · 一起把日子过得清爽</div></div>'+
    '<div class="hero"><div class="k">本月人均应摊（3 人 AA）</div><div class="v">¥'+fmt(s.per)+'</div>'+
      '<div class="row"><span>总支出 <b>¥'+fmt(s.total)+'</b></span><span>待结算 <b>¥'+fmt(s.transfers.reduce(function(a,t){return a+t.amt;},0))+'</b></span></div></div>'+
    '<div class="block"><div class="block-head"><h3>需要你处理</h3></div><div class="card" style="padding:2px 14px">'+todos+'</div></div>'+
    '<div class="block"><div class="block-head"><h3>本周值日</h3><span class="more" onclick="switchTab(\'duty\')">查看排班 ›</span></div>'+
      '<div class="card" style="display:flex;align-items:center;gap:12px">'+av(today.person)+
        '<div style="flex:1"><div style="font-size:14px;font-weight:600">'+(today.done?'今日已打卡 ✓':'今日 · '+today.area)+'</div><div style="font-size:12px;color:var(--ink-2);margin-top:2px">'+today.person+' · '+today.day+'</div></div>'+
        (today.done ? '<span class="pill green">已完成</span>' : '<button class="btn primary sm" onclick="checkIn()">我完成了</button>')+
      '</div></div>';
}

function renderBills(){
  var s = computeSettle();
  var list = bills.map(function(b){
    var statusHtml = b.status==='pending' ? '<span class="pill amber">待确认</span>' : '<span class="pill green">已分摊</span>';
    return '<div class="bill"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.4L14 21l-2-1.4L10 21l-2-1.4L6 21z"/><path d="M9.5 8h5M9.5 12h5"/></svg></div>'+
      '<div class="b"><div class="n">'+b.title+'</div><div class="m">'+av(b.payer,'sm')+' '+b.payer+' 垫付 · '+b.date+'</div></div>'+
      '<div style="text-align:right"><div class="amt">¥'+fmt(b.amount)+'</div><div style="margin-top:4px">'+statusHtml+'</div></div></div>';
  }).join('');

  var settleLines = s.transfers.map(function(t){
    return '<div class="line"><span class="who">'+av(t.from,'sm')+' '+t.from+'</span><span class="arrow">→</span><span class="who">'+av(t.to,'sm')+' '+t.to+'</span><span class="amt">¥'+fmt(t.amt)+'</span></div>';
  }).join('');

  document.getElementById('screen-bills').innerHTML =
    '<div class="sec-title">费用 AA</div><div class="sec-sub">每笔开销按人头均摊，账目清清爽爽</div>'+
    '<div class="stat-row" style="margin-bottom:14px">'+
      '<div class="stat"><div class="k">本月总支出</div><div class="v">¥'+fmt(s.total)+'</div></div>'+
      '<div class="stat"><div class="k">人均</div><div class="v">¥'+fmt(s.per)+'</div></div>'+
      '<div class="stat"><div class="k">待结算</div><div class="v">¥'+fmt(s.transfers.reduce(function(a,t){return a+t.amt;},0))+'</div></div></div>'+
    '<div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:700;margin-bottom:4px">谁该转给谁（净额结算）</div><div class="settle">'+settleLines+'</div>'+
      '<button class="btn soft block" style="margin-top:10px" onclick="openSettle()">查看结算清单</button></div>'+
    '<div class="block"><div class="block-head"><h3>账单明细</h3><span class="more" onclick="openBill()">+ 记一笔</span></div>'+
      '<div class="card" style="padding:6px 14px">'+list+'</div></div>';
}

function renderDuty(){
  var today = duties.filter(function(d){return d.today;})[0];
  var doneCount = duties.filter(function(d){return d.done;}).length;
  var week = duties.map(function(d){
    return '<div class="day'+(d.today?' today':'')+(d.done?' done':'')+'"><div class="d">'+d.day+'</div><div class="p">'+d.person+'</div><div class="a">'+d.area+'</div>'+
      '<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span></div>';
  }).join('');

  document.getElementById('screen-duty').innerHTML =
    '<div class="sec-title">清洁值日</div><div class="sec-sub">每周自动轮换，干完打卡，谁也别想偷懒</div>'+
    '<div class="card" style="background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;margin-bottom:14px">'+
      '<div style="font-size:12px;opacity:.85">今日值日</div>'+
      '<div style="display:flex;align-items:center;gap:12px;margin-top:10px">'+av(today.person)+
        '<div style="flex:1"><div style="font-size:18px;font-weight:700">'+today.area+'</div><div style="font-size:12.5px;opacity:.85;margin-top:2px">'+today.person+' · '+today.day+'</div></div>'+
        (today.done ? '<span class="pill" style="background:rgba(255,255,255,.2);color:#fff">已完成 ✓</span>' : '<button class="btn" style="background:#fff;color:var(--accent)" onclick="checkIn()">我完成了</button>')+
      '</div><div style="font-size:12px;opacity:.85;margin-top:12px">本周已完成 '+doneCount+'/7 天</div></div>'+
    '<div class="block"><div class="block-head"><h3>本周排班</h3><span class="more">按周自动轮换</span></div><div class="week">'+week+'</div></div>'+
    '<div class="block"><div class="block-head"><h3>排班规则</h3></div>'+
      '<div class="card" style="font-size:13px;color:var(--ink-2);line-height:1.7">厨房、卫生间、客厅、倒垃圾四个区域按周轮换，每人每周轮 2–3 次；<b style="color:var(--ink)">连续打卡 7 天可兑换一次免值日</b>（当月有效）。</div></div>';
}

function renderItems(){
  var list = items.map(function(i){
    var pill = i.stock==='低' ? '<span class="pill red">低库存</span>' : (i.stock==='充足' ? '<span class="pill green">充足</span>' : '<span class="pill grey">一般</span>');
    var icon = i.cat==='清洁' ? 'bubble' : (i.cat==='厨房' ? 'pot' : 'box');
    var ic = {box:'<path d="M12 3.5 19 7v10l-7 3.5L5 17V7z"/><path d="M5 7l7 3.5L19 7M12 10.5V20.5"/>', bubble:'<path d="M12 3c3 0 5.5 2 5.5 4.5S15 12 12 12s-5.5-2-5.5-4.5S9 3 12 3z"/><path d="M6 11c-2 .8-3.5 2.4-3.5 4.5S4 20 6.5 20c1.2 0 2.3-.3 3.2-.9"/>', pot:'<path d="M5 9h14v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6z"/><path d="M9 9V6.5h6V9M12 3.5v3M4 13h16"/>'}[icon];
    return '<div class="item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+ic+'</svg></div>'+
      '<div class="b"><div class="n">'+i.name+'</div><div class="m">'+i.note+' · '+i.by+' 采购</div></div>'+pill+'</div>';
  }).join('');

  var lowCount = items.filter(function(i){return i.stock==='低';}).length;

  document.getElementById('screen-items').innerHTML =
    '<div class="sec-title">公共物品</div><div class="sec-sub">用完谁买？剩多少？都记在明面上</div>'+
    (lowCount ? '<div class="card" style="background:var(--danger-soft);border-color:var(--danger);margin-bottom:14px;display:flex;align-items:center;gap:10px;color:var(--danger)">'+
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3.5v7L12 17l-7-3.5v-7z"/><path d="M12 10.5V17"/></svg>'+
      '<span style="font-size:13px;font-weight:600">'+lowCount+' 件物品库存偏低，建议近期补货</span></div>' : '')+
    '<div class="block"><div class="block-head"><h3>物品清单</h3><span class="more" onclick="openItem()">+ 登记</span></div>'+
      '<div class="card" style="padding:6px 14px">'+list+'</div></div>';
}

function renderRules(){
  var list = rules.map(function(r, idx){
    var open = (document.getElementById('screen-rules').getAttribute('data-open')==String(idx));
    var signedMe = r.signedBy.indexOf('小林')>=0;
    var sigs = PEOPLE.map(function(p){
      var on = r.signedBy.indexOf(p)>=0;
      return '<span class="sig'+(on?' on':'')+'">'+(on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>':p[0])+'</span>';
    }).join('');
    var pill = r.signedBy.length===3 ? '<span class="pill green">已生效</span>' : '<span class="pill amber">待签字</span>';
    return '<div class="card rule'+(open?' open':'')+'" onclick="toggleRule('+idx+')">'+
      '<div class="top"><div class="r"><div class="n">《'+r.title+'》</div><div class="m">'+pill+' <span>'+r.author+' 起草 · '+r.signedBy.length+'/3 已签</span></div></div>'+
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="color:var(--ink-3);margin-top:6px;transform:'+(open?'rotate(180deg)':'')+';transition:transform .2s"><path d="m6 9 6 6 6-6"/></svg></div>'+
      '<div class="detail"><p>'+r.body+'</p><div class="sign-line">'+sigs+'<span class="lbl">'+r.signedBy.length+'/3 已签字</span></div>'+
      (signedMe ? '<div class="act"><span class="pill green">你已签字</span></div>' : '<div class="act"><button class="btn primary sm" onclick="event.stopPropagation();signRule('+idx+')">我同意并签字</button></div>')+
      '</div></div>';
  }).join('');

  document.getElementById('screen-rules').innerHTML =
    '<div class="sec-title">室友公约</div><div class="sec-sub">白纸黑字说清楚，摩擦就少一大半</div>'+
    '<div class="block"><div class="block-head"><h3>全部公约</h3><span class="more" onclick="openRule()">+ 起草</span></div>'+list+'</div>';
}

function renderAll(){ renderHome(); renderBills(); renderDuty(); renderItems(); renderRules(); }

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===tab); });
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelector('.content').scrollTop = 0;
}
function openBill(){ renderChips('bill-cat',CATS,billForm.cat,'setBillCat'); renderChips('bill-payer',PEOPLE,billForm.payer,'setBillPayer'); renderChips('bill-split',SPLITS,billForm.split,'setBillSplit'); openModal('modal-bill'); }
function submitBill(){
  var amt = parseFloat(document.getElementById('bill-amt').value);
  if(!amt || amt<=0){ toast('请先填写有效金额'); return; }
  var title = billForm.cat + (document.getElementById('bill-note').value ? ' · '+document.getElementById('bill-note').value : '');
  bills.unshift({title:title, amount:amt, payer:billForm.payer, date:'9/12', status:'settled'});
  document.getElementById('bill-amt').value=''; document.getElementById('bill-note').value='';
  closeModal('modal-bill'); renderAll(); switchTab('bills');
  toast('已记一笔 ¥'+fmt(amt)+'，已按 '+billForm.split+' 计入');
}
function openItem(){ renderChips('item-cat',ITEM_CATS,itemForm.cat,'setItemCat'); renderChips('item-stock',STOCKS,itemForm.stock,'setItemStock'); renderChips('item-payer',PEOPLE,itemForm.payer,'setItemPayer'); openModal('modal-item'); }
function submitItem(){
  var name = document.getElementById('item-name').value.trim();
  if(!name){ toast('请填写物品名称'); return; }
  items.unshift({name:name, cat:itemForm.cat, stock:itemForm.stock, note:'刚登记', by:itemForm.payer});
  document.getElementById('item-name').value='';
  closeModal('modal-item'); renderAll(); switchTab('items');
  toast('已登记「'+name+'」');
}
function openRule(){ renderChips('rule-type',RULE_TYPES,ruleForm.type,'setRuleType'); openModal('modal-rule'); }
function submitRule(){
  var title = document.getElementById('rule-title').value.trim();
  var body = document.getElementById('rule-body').value.trim();
  if(!title || !body){ toast('标题和条款都要填哦'); return; }
  rules.unshift({title:title, author:'小林', signedBy:['小林'], type:ruleForm.type, body:body});
  document.getElementById('rule-title').value=''; document.getElementById('rule-body').value='';
  closeModal('modal-rule'); renderAll(); switchTab('rules');
  toast('公约已提交，等室友签字');
}
function checkIn(){
  var today = duties.filter(function(d){return d.today;})[0];
  if(today.done){ toast('今天已经打过卡啦'); return; }
  today.done = true; renderAll();
  toast('打卡成功，本周已连续 5 天 ✓');
}
function toggleRule(idx){
  var el = document.getElementById('screen-rules');
  el.setAttribute('data-open', el.getAttribute('data-open')===String(idx) ? '-1' : String(idx));
  renderRules();
}
function signRule(idx){
  var r = rules[idx];
  if(r.signedBy.indexOf('小林')<0){ r.signedBy.push('小林'); }
  renderRules(); renderHome();
  toast('已签字，公约生效中');
}
function openSettle(){
  var s = computeSettle();
  var body = '<div class="hint" style="margin-bottom:8px">按人均 ¥'+fmt(s.per)+' 结算，以下为应转账明细：</div>'+
    '<div class="settle">'+s.transfers.map(function(t){
      return '<div class="line"><span class="who">'+av(t.from,'sm')+' '+t.from+'</span><span class="arrow">→</span><span class="who">'+av(t.to,'sm')+' '+t.to+'</span><span class="amt">¥'+fmt(t.amt)+'</span></div>';
    }).join('')+'</div>';
  document.getElementById('settle-body').innerHTML = body;
  openModal('modal-settle');
}

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-mask').forEach(function(m){
  m.addEventListener('click', function(e){ if(e.target===m) m.classList.remove('show'); });
});
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}

renderAll();
switchTab('home');
</script>
